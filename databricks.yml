# Databricks Asset Bundle for the football data pipeline.
#
#   databricks bundle validate              check the configuration
#   databricks bundle deploy                deploy to dev (the default target)
#   databricks bundle deploy -t prod        deploy to prod
#   databricks bundle run sportmonks_ingest run the deployed job
bundle:
  name: football_data_project

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the pipeline's schema.
    default: workspace
  sportmonks_schema:
    description: Schema that holds the pipeline's tables and volumes.
    default: football_data_project_sportmonks

targets:
  # Deploys a copy of the job named "[dev <user>] Sportmonks Ingest" with its
  # schedule paused. It reads and writes a scratch schema that the bundle
  # creates, so it never touches the production tables.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9b6b9cf8-eff9.cloud.databricks.com
    variables:
      # Development mode prefixes the schema declared in resources/ with this.
      sportmonks_schema: dev_${workspace.current_user.short_name}_football_data_project_sportmonks

  prod:
    mode: production
    workspace:
      host: https://dbc-9b6b9cf8-eff9.cloud.databricks.com
      root_path: /Workspace/Users/nicholas.navarro@knowit.fi/.bundle/${bundle.name}/${bundle.target}
